<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GradWay · Find your way on campus</title>
  <meta name="description" content="Find class buildings, dining, parking and campus links at 15+ colleges. GradWay for the web, for students and visitors on any phone.">
  <meta name="theme-color" content="#0d1322">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-itunes-app" content="app-id=1069778462">

  <meta property="og:type" content="website">
  <meta property="og:title" content="GradWay · Find your way on campus">
  <meta property="og:description" content="Class buildings, dining, parking and campus links for students and visitors. No download needed.">
  <meta property="og:image" content="icons/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Light or dark before the page draws, so it never flashes the wrong theme.
    try { if (JSON.parse(localStorage.getItem("gradway.theme")) === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
</head>
<body data-route="dashboard">
  <div class="glow" aria-hidden="true"></div>

  <div class="layout">
    <main id="view" class="view" tabindex="-1"></main>

    <section id="map-pane" class="map-pane" hidden aria-label="Campus map">
      <div id="map" class="map"></div>

      <div class="map-top">
        <a id="map-back" class="icon-btn glass" href="#/" aria-label="Back to dashboard"></a>
        <form id="map-search" class="map-search glass" role="search">
          <span id="map-search-icon"></span>
          <input id="map-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search buildings, ATMs, coffee…" aria-label="Search the campus map">
          <button id="map-clear" class="clear-btn" type="button" aria-label="Clear search" hidden></button>
        </form>
      </div>
      <nav id="map-chips" class="chips map-chips" aria-label="Quick searches"></nav>
      <p id="map-status" class="map-status glass" role="status" aria-live="polite" hidden></p>
      <div id="map-notice" class="map-notice glass" role="alert" hidden></div>
      <button id="map-locate" class="icon-btn glass locate-btn" type="button" aria-label="Show my location"></button>
      <button id="map-campus" class="icon-btn glass campus-btn" type="button" aria-label="Back to campus center" title="Back to campus"></button>
      <button id="map-layers" class="icon-btn glass layers-btn" type="button" aria-label="Map style and details" aria-expanded="false" aria-controls="map-layers-panel"></button>
      <div id="map-layers-panel" class="layers-panel glass" hidden></div>
      <div id="map-sheet" class="map-sheet glass" hidden></div>
    </section>
  </div>

  <dialog id="mode-dialog" class="sheet-dialog" aria-labelledby="mode-title">
    <p class="eyebrow gold mode-campus"></p>
    <h2 id="mode-title" class="dialog-title">Are you a student here, or visiting?</h2>
    <p class="muted">GradWay shows the links that fit. You can switch any time.</p>
    <div class="mode-options">
      <button class="mode-option" data-mode="student">
        <span class="mode-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 9 9.5-4.5L21.5 9 12 13.5z"/><path d="M6.5 11v4.5c1.5 1.5 3.4 2.2 5.5 2.2s4-.7 5.5-2.2V11M21.5 9v5"/></svg>
        </span>
        <span><strong>I'm a student</strong><span class="muted small">Next class, student portal, schedule</span></span>
      </button>
      <button class="mode-option" data-mode="visitor">
        <span class="mode-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4.5h11.5l-2 3.5 2 3.5H5"/></svg>
        </span>
        <span><strong>I'm visiting</strong><span class="muted small">Parking, the university website, campus info</span></span>
      </button>
    </div>
  </dialog>

  <dialog id="safety-dialog" class="sheet-dialog" aria-labelledby="safety-title">
    <div class="dialog-head">
      <h2 id="safety-title" class="dialog-title">Safety &amp; Emergency</h2>
      <button class="icon-btn subtle" data-action="close-dialog" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="safety-body" class="dialog-body"></div>
  </dialog>

  <dialog id="class-dialog" class="sheet-dialog" aria-labelledby="class-title">
    <form method="dialog" data-form="class" class="class-form" novalidate>
      <h2 id="class-title" class="dialog-title">Add a class</h2>
      <label class="field"><span>Class</span><input name="name" placeholder="BIO 1134 or Biology" autocomplete="off" maxlength="60" required></label>
      <label class="field"><span>Course title <em class="optional">optional</em></span><input name="title" placeholder="Biology I" autocomplete="off" maxlength="80"></label>
      <div class="field-row">
        <label class="field grow"><span>Building</span><input name="building" list="building-options" placeholder="Start typing a building" autocomplete="off"></label>
        <label class="field room"><span>Room <em class="optional">optional</em></span><input name="room" placeholder="215" autocomplete="off" maxlength="20"></label>
      </div>
      <datalist id="building-options"></datalist>
      <fieldset class="field">
        <legend>Days</legend>
        <div class="day-toggles">
          <label><input type="checkbox" name="days" value="1"><span>M</span></label>
          <label><input type="checkbox" name="days" value="2"><span>T</span></label>
          <label><input type="checkbox" name="days" value="3"><span>W</span></label>
          <label><input type="checkbox" name="days" value="4"><span>Th</span></label>
          <label><input type="checkbox" name="days" value="5"><span>F</span></label>
        </div>
      </fieldset>
      <label class="field"><span>Starts at</span><input name="time" type="time" required></label>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn-glass" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-gold" value="save" id="class-save">Save class</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="noscript">GradWay needs JavaScript to show campus maps.</p></noscript>

  <script src="vendor/maplibre-gl.js" defer></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
